{% extends "base.html" %}

{% block title %}Add Freelancer{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Add New Freelancer</h2>
    <form method="POST">
        <div class="form-group">
            <label for="name">Freelancer Name *</label>
            <input type="text" name="name" id="name" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" name="email" id="email" required>
        </div>
        
        <div class="form-group">
            <label for="registration_date">Registration Date *</label>
            <input type="date" name="registration_date" id="registration_date" required value="{{ today }}">
        </div>
        
        <button type="submit">Add Freelancer</button>
        <a href="{{ url_for('dashboard_admin') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
